<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Köln Guide</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@600&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: sticky header with tabs; filter rail on the left and a card grid on the right on wide screens, stacked on phones. */
:root {
  --bg: #F2F2EE;
  --surface: #FFFFFF;
  --ink: #1B1A18;
  --muted: #625E57;
  --line: #DCDAD3;
  --chip: #E8E7E1;
  --accent: #C30F2B;
  --accent-ink: #FFFFFF;
  --accent-soft: #F7E1E4;
  --star: #A87400;
  --header: #FFFFFF;
  --land: #F7F7F4; --water: #CBDDE8; --route2: #1F6FB2;
  --c-food: #C30F2B; --c-cafe: #8A5A2B; --c-beer: #B07A00; --c-bar: #6B3FA0; --c-sight: #1F7A4D;
  --font-display: "Grenze Gotisch", "UnifrakturMaguntia", Georgia, serif;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101315; --surface: #181C1F; --ink: #ECEAE6; --muted: #A6A39D; --line: #2D3337;
    --chip: #232A2E; --accent: #F04A60; --accent-ink: #16070A; --accent-soft: #3B1B21;
    --star: #E8C14E; --header: #14181B; color-scheme: dark;
    --land: #15191C; --water: #1F3B4D; --route2: #5AA9E6;
    --c-food: #F04A60; --c-cafe: #D09A66; --c-beer: #E8C14E; --c-bar: #B48AE8; --c-sight: #4CC38A;
  }
}
:root[data-theme="dark"] {
  --bg: #101315; --surface: #181C1F; --ink: #ECEAE6; --muted: #A6A39D; --line: #2D3337;
  --chip: #232A2E; --accent: #F04A60; --accent-ink: #16070A; --accent-soft: #3B1B21;
  --star: #E8C14E; --header: #14181B; color-scheme: dark;
    --land: #15191C; --water: #1F3B4D; --route2: #5AA9E6;
    --c-food: #F04A60; --c-cafe: #D09A66; --c-beer: #E8C14E; --c-bar: #B48AE8; --c-sight: #4CC38A;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.55; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--header); }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }

.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--header); border-bottom: 3px solid var(--accent); }
.top-inner { max-width: 1280px; margin: 0 auto; padding-block: 10px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 24px; }
.brand { display: flex; align-items: baseline; gap: 12px; min-width: 0; }
.wordmark { font-family: var(--font-display); font-weight: 600; font-size: 40px; line-height: 1; color: var(--accent); letter-spacing: 0.01em; }
.brand-text { display: flex; flex-direction: column; min-width: 0; }
.brand-text strong { font-size: 15px; font-weight: 600; }
.brand-text span { font-size: 12px; color: var(--muted); }
.tabs { display: flex; gap: 4px; margin-left: auto; overflow-x: auto; scrollbar-width: none; max-width: 100%; }
.tabs a { text-decoration: none; color: var(--ink); font-weight: 600; font-size: 15px; padding: 8px 12px; border-radius: 999px; white-space: nowrap; }
.tabs a .n { font-family: var(--font-data); font-size: 12px; color: var(--muted); margin-left: 4px; }
.tabs a[aria-current="page"] { background: var(--accent); color: var(--accent-ink); }
.tabs a[aria-current="page"] .n { color: inherit; opacity: .8; }
@media (max-width: 600px) { .tabs a .n { display: none; } .tabs a { padding: 8px 10px; } }

.wrap { max-width: 1280px; margin: 0 auto; padding-block: 20px 48px; }
.layout { display: grid; grid-template-columns: 1fr; gap: 20px; align-items: start; }
@media (min-width: 960px) {
  .layout { grid-template-columns: 300px minmax(0, 1fr); gap: 28px; }
  .rail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 84px); max-height: calc(100vh - 100px); overflow-y: auto; }
}

.rail { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.rail > summary { list-style: none; cursor: pointer; padding: 12px 14px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
.rail > summary::-webkit-details-marker { display: none; }
.rail > summary .applied { font-family: var(--font-data); font-size: 12px; color: var(--accent); }
.rail-body { padding: 0 14px 14px; display: flex; flex-direction: column; gap: 16px; }
.group { display: flex; flex-direction: column; gap: 8px; }
.group-label { font-size: 12px; color: var(--muted); }
.group-label b { font-family: var(--font-body); font-size: 13px; letter-spacing: 0; text-transform: none; color: var(--ink); font-weight: 600; margin-right: 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: inherit; font-size: 13px; border: 1px solid transparent; background: var(--chip); color: var(--ink); padding: 4px 10px; border-radius: 999px; cursor: pointer; }
.chip .n { font-family: var(--font-data); font-size: 11px; color: var(--muted); margin-left: 4px; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.chip[aria-pressed="true"] .n { color: inherit; opacity: .75; }
.chip:disabled { opacity: .4; cursor: default; }
.seg { display: flex; flex-wrap: wrap; gap: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { font: inherit; font-size: 13px; flex: 1 1 auto; background: var(--surface); color: var(--ink); border: 0; border-right: 1px solid var(--line); padding: 6px 8px; cursor: pointer; }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.seg button:disabled { opacity: .4; cursor: default; }
input[type="search"], select { font: inherit; font-size: 14px; width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); }
.hint { font-size: 12px; color: var(--muted); margin: 0; }
.more-filters { border-top: 1px solid var(--line); padding-top: 12px; }
.more-filters > summary { cursor: pointer; font-weight: 600; font-size: 14px; list-style: none; }
.more-filters > summary::-webkit-details-marker { display: none; }
.more-filters > summary::after { content: " +"; color: var(--muted); }
.more-filters[open] > summary::after { content: " −"; }
.more-filters .group { margin-top: 14px; }
.anchor-note { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.linkbtn { font: inherit; font-size: 13px; font-weight: 600; background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; }
.reset { font: inherit; font-size: 13px; align-self: flex-start; background: none; border: 1px solid var(--line); color: var(--ink); border-radius: 8px; padding: 6px 12px; cursor: pointer; }

.results-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 16px; margin-bottom: 12px; }
.results-head h2 { font-size: 20px; }
.results-head .sub { font-size: 13px; color: var(--muted); }
.notice { background: var(--accent-soft); border-radius: 8px; padding: 8px 12px; font-size: 13px; margin: 0 0 12px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); gap: 14px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.card-top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.eyebrow { font-size: 12px; letter-spacing: .01em; color: var(--muted); }
.price { font-family: var(--font-data); font-size: 13px; letter-spacing: .05em; white-space: nowrap; }
.price i { font-style: normal; color: var(--line); }
.price .est { font-family: var(--font-body); font-size: 10px; color: var(--muted); margin-left: 4px; letter-spacing: 0; }
.card h3 { font-size: 17px; font-weight: 700; line-height: 1.3; }
.card h3 .alt { font-weight: 500; font-size: 13px; color: var(--muted); margin-left: 6px; }
.cuisine { margin: 0; font-size: 13px; color: var(--muted); }
.meta { margin: 0; display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 13px; font-variant-numeric: tabular-nums; }
.meta .star { color: var(--star); }
.meta .num { font-family: var(--font-data); font-size: 12px; }
.meta .beer { color: var(--ink); font-weight: 600; }
.summary { margin: 2px 0 0; font-size: 14px; }
.awards { display: flex; flex-wrap: wrap; gap: 4px; }
.award { font-size: 11px; font-weight: 600; border: 1px solid var(--accent); color: var(--accent); border-radius: 4px; padding: 1px 6px; }
.try { display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: baseline; font-size: 13px; }
.try .label, .tags .label { font-size: 12px; font-weight: 600; color: var(--muted); }
.pill { background: var(--chip); border-radius: 4px; padding: 1px 6px; }
.tags { display: flex; flex-wrap: wrap; gap: 4px; font-size: 12px; color: var(--muted); }
.tags span + span::before { content: "·"; margin-right: 4px; }
.more { font-size: 13px; }
.more summary { cursor: pointer; color: var(--muted); }
.more p { margin: 6px 0 0; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: auto; padding-top: 8px; }
.btn { font-size: 13px; font-weight: 600; text-decoration: none; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; color: var(--ink); background: var(--surface); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.meta .ok { color: var(--muted); font-size: 12px; }
.empty { background: var(--surface); border: 1px dashed var(--line); border-radius: var(--radius); padding: 28px; text-align: center; color: var(--muted); }

.wine { display: flex; flex-direction: column; gap: 28px; }
.wine h2 { font-size: 22px; }
.wine .lede { max-width: 68ch; margin: 6px 0 0; color: var(--muted); }
.terms { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); gap: 8px 16px; margin: 12px 0 0; }
.terms div { border-top: 1px solid var(--line); padding-top: 8px; min-width: 0; }
.terms dt { font-weight: 700; }
.terms dd { margin: 2px 0 0; font-size: 14px; color: var(--muted); }
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); margin-top: 12px; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 12px; color: var(--muted); font-weight: 600; }
tr:last-child td { border-bottom: 0; }
footer { font-size: 12px; color: var(--muted); margin-top: 32px; }
.layout > * { min-width: 0; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.presets { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; max-width: 100%; min-width: 0; flex: 1 1 auto; }
.preset { font: inherit; font-size: 13px; white-space: nowrap; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 5px 11px; cursor: pointer; }
.preset[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); font-weight: 600; }
.viewtoggle { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; flex: none; }
.viewtoggle button { font: inherit; font-size: 13px; border: 0; background: var(--surface); color: var(--ink); padding: 5px 12px; cursor: pointer; }
.viewtoggle button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.active-chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 12px; }
.achip { font: inherit; font-size: 12px; border: 0; border-radius: 999px; padding: 3px 9px; background: var(--accent-soft); color: var(--ink); cursor: pointer; }
.achip::after { content: " ×"; color: var(--muted); }
.achip.clear { background: none; color: var(--accent); text-decoration: underline; }
.achip.clear::after { content: ""; }
.map-wrap { background: var(--land); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.map-wrap svg { display: block; width: 100%; height: auto; }
.map-note { font-size: 12px; color: var(--muted); margin: 6px 0 0; }
.map-pick { margin-top: 12px; max-width: 520px; }
.m-land { fill: var(--land); }
.m-water { fill: none; stroke: var(--water); stroke-linecap: round; stroke-linejoin: round; }
.m-label { fill: var(--muted); font-size: 12px; font-family: var(--font-body); }
.m-river { fill: var(--muted); font-size: 12px; font-style: italic; letter-spacing: .08em; }
.m-anchor { fill: var(--surface); stroke: var(--ink); stroke-width: 1.5; }
.m-anchor-t { fill: var(--ink); font-size: 12px; font-weight: 600; font-family: var(--font-body); }
.dot { stroke: var(--surface); stroke-width: 1.5; cursor: pointer; }
.dot.sel { stroke: var(--ink); stroke-width: 2.5; }
.hit { fill: transparent; cursor: pointer; }
.k-food { fill: var(--c-food); } .k-cafe { fill: var(--c-cafe); } .k-beer { fill: var(--c-beer); } .k-bar { fill: var(--c-bar); } .k-sight { fill: var(--c-sight); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--muted); margin-top: 6px; }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 4px; vertical-align: middle; }
.r-line { fill: none; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
.r-main { stroke: var(--accent); } .r-short { stroke: var(--route2); }
.r-stop { stroke: var(--surface); stroke-width: 2; }
.r-stop-t { fill: var(--accent-ink); font-size: 11px; font-weight: 700; font-family: var(--font-data); }
.r-km { fill: var(--surface); stroke: var(--muted); stroke-width: 1.5; }
.r-km-t { fill: var(--muted); font-size: 10px; font-family: var(--font-data); }
.fab { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 6; font: inherit; font-weight: 600; font-size: 14px; border: 0; border-radius: 999px; padding: 10px 16px; background: var(--ink); color: var(--surface); box-shadow: 0 4px 14px rgba(0, 0, 0, .18); cursor: pointer; }
@media (min-width: 960px) { .fab { display: none; } }
.run { display: flex; flex-direction: column; gap: 18px; }
.run-head { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; }
.run-head h2 { font-size: 22px; }
.run-stats { display: flex; flex-wrap: wrap; gap: 6px 22px; font-size: 13px; color: var(--muted); }
.run-stats b { display: block; font-family: var(--font-data); font-size: 20px; color: var(--ink); font-weight: 500; }
.run-grid { display: grid; grid-template-columns: 1fr; gap: 18px; align-items: start; }
@media (min-width: 960px) { .run-grid { grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); } }
.run-links { display: flex; flex-wrap: wrap; gap: 8px; }
.stops { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.stops li { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 10px; border-bottom: 1px solid var(--line); padding-bottom: 10px; }
.stops .km { font-family: var(--font-data); font-size: 12px; color: var(--muted); text-align: right; padding-top: 3px; }
.stops .nm { font-weight: 700; }
.stops .nm small { font-weight: 500; color: var(--muted); margin-left: 4px; }
.stops .ty { font-size: 12px; color: var(--accent); font-weight: 600; }
.stops p { margin: 2px 0 6px; font-size: 14px; }
.stops a { font-size: 13px; font-weight: 600; text-decoration: none; }
.tips { margin: 0; padding-left: 18px; font-size: 14px; display: flex; flex-direction: column; gap: 6px; }
.sun { border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
.sun td, .sun th { padding: 4px 12px 4px 0; border-bottom: 1px solid var(--line); text-align: left; }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; transition: none !important; } }
</style>
</head>
<body>
<header class="top">
  <div class="top-inner gutter">
    <div class="brand">
      <span class="wordmark" aria-hidden="true">Köln</span>
      <div class="brand-text"><strong>쾰른 맛집·바·관광지</strong><span id="stamp">구글 ★4.2+ · 리뷰 50+</span></div>
    </div>
    <nav class="tabs" aria-label="섹션">
      <a href="#food" data-tab="food">맛집<span class="n"></span></a>
      <a href="#beer" data-tab="beer">맥주<span class="n"></span></a>
      <a href="#bars" data-tab="bars">바<span class="n"></span></a>
      <a href="#sights" data-tab="sights">관광지<span class="n"></span></a>
      <a href="#run" data-tab="run">러닝</a>
      <a href="#wine" data-tab="wine">와인</a>
    </nav>
  </div>
</header>
<main class="wrap gutter">
  <div class="layout" id="layout">
    <details class="rail" id="rail">
      <summary>필터 <span class="applied" id="applied"></span></summary>
      <div class="rail-body" id="filters"></div>
    </details>
    <section aria-live="polite">
      <div class="results-head"><h2 id="rtitle">맛집</h2><span class="sub" id="rsub"></span></div>
      <div class="toolbar" id="toolbar"></div>
      <div class="active-chips" id="achips" hidden></div>
      <p class="notice" id="notice" hidden></p>
      <div id="mapview" hidden></div>
      <div class="grid" id="grid"></div>
    </section>
  </div>
  <div class="wine" id="wineview" hidden></div>
  <div class="run" id="runview" hidden></div>
  <button type="button" class="fab" id="fab" hidden>필터</button>
  <footer id="foot"></footer>
</main>
<script>window.KOLN_CONFIG={"geolocation": true, "downloads": true};</script>
<script src="data.js"></script>
<script>
(function () {
  "use strict";
  var G = window.KOLN_GUIDE || { restaurants: [], bars: [], shops: [], attractions: [], areas: [], anchors: [], labels: {} };
  var CFG = window.KOLN_CONFIG || {};
  var L = G.labels || {};
  var AREAS = {}; (G.areas || []).forEach(function (a) { AREAS[a.id] = a; });
  var ANCHOR_IDS = ["dom", "hbf", "messe", "belgisches"];
  var ANCHORS = (G.anchors || []).filter(function (a) { return ANCHOR_IDS.indexOf(a.id) >= 0; });
  var TABS = {
    food: { title: "맛집", items: G.restaurants || [] },
    beer: { title: "맥주 펍", items: (G.restaurants || []).filter(function (i) { return i.category === "brauhaus"; })
      .concat((G.bars || []).filter(function (i) { return i.category === "kneipe" || i.category === "beer-bar"; })) },
    bars: { title: "칵테일·바", items: (G.bars || []).filter(function (i) { return i.category !== "kneipe" && i.category !== "beer-bar"; }).concat(G.shops || []) },
    sights: { title: "관광지", items: G.attractions || [] },
    run: { title: "러닝 코스", items: [] },
    wine: { title: "독일 화이트와인", items: [] }
  };
  var KM_STEPS = [0, 0.5, 1, 2, 3, 5];
  var MIN_RATINGS = [0, 4.4, 4.6, 4.8];

  function fresh() { return { q: "", sel: {}, minRating: 0, maxBeer: 0, free: false, must: false, open: false }; }
  var BEER_STEPS = [0, 2.3, 2.6, 2.9];
  var state = { tab: "food", anchor: "dom", maxKm: 0, sort: { food: "rating", beer: "rating", bars: "rating", sights: "priority" },
    origin: null, originLabel: "", moreOpen: {}, view: {}, mapSel: null, route: "main", preset: {}, f: { food: fresh(), beer: fresh(), bars: fresh(), sights: fresh() } };

  function store(k, v) { try { localStorage.setItem("kg." + k, v); } catch (e) {} }
  function recall(k) { try { return localStorage.getItem("kg." + k); } catch (e) { return null; } }
  var savedAnchor = recall("anchor"); if (savedAnchor && ANCHOR_IDS.indexOf(savedAnchor) >= 0) state.anchor = savedAnchor;

  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function lab(group, key) { return (L[group] && L[group][key]) || key || ""; }
  function keys(o) { return Object.keys(o || {}).filter(function (k) { return o[k]; }); }
  function arr(v) { return v == null ? [] : [].concat(v); }

  function fitExt(pts, minLat, minLng) {

    }).join("") + '<li><span class="km">' + km.toFixed(1) + ' km</span><div><div class="ty">S · 도착</div><div class="nm">프리젠플라츠<small>Friesenplatz</small></div></div></li></ol></div>';
    var sun = ((G.routes || {}).sun || []).map(function (x) { return "<tr><td>" + esc(x.date.slice(5).replace("-", "/")) + "</td><td>" + esc(x.sunrise) + "</td><td>" + esc(x.sunset) + "</td></tr>"; }).join("");
    html += '<section><h2 style="font-size:18px">달리기 전에</h2><ul class="tips" style="margin-top:8px">' +
      "<li>11월엔 해가 늦게 뜨고 일찍 져요. 어두울 땐 밝은 옷이나 라이트를 챙기세요.</li>" +
      "<li>호엔촐레른 다리 보행로와 대성당 앞은 낮에 붐벼요. 이른 아침이 가장 편해요.</li>" +
      "<li>11/16부터 대성당 남쪽 로마 광장에 크리스마스 마켓이 서요(11시 개장). 아침엔 지나가기 괜찮아요.</li>" +
      "<li>구시가(알터 마르크트·그로스 장크트 마르틴 주변)는 돌길이에요. 발목 조심하세요.</li>" +
      "<li>라인강 산책로와 라인아우하펜은 차 없는 평지라 페이스 내기 좋아요. 링(Ring) 구간은 신호등이 많아요.</li>" +
      "<li>구글 마이맵: mymaps.google.com → 새 지도 → 가져오기 → KML 파일. GPX는 Strava·Garmin·Komoot에서 경로 가져오기로 넣어요.</li></ul>" +
      (sun ? '<table class="sun" style="margin-top:12px"><thead><tr><th>날짜</th><th>일출</th><th>일몰</th></tr></thead><tbody>' + sun + "</tbody></table>" : "") + "</section>";
    el.innerHTML = html;
    drawRunMap(rt);
  }
  function drawRunMap(rt) {
    var box = document.getElementById("runmap");
    if (!box) return;
    var g = mapGeo(fitExt(rt.path.concat(rt.stops.map(function (x) { return [x.lat, x.lng]; })), 0.006, 0.01), boxWidth(box, 700));
    var pts = rt.path.map(function (q) { var p = g.p(q[0], q[1]); return p[0].toFixed(1) + "," + p[1].toFixed(1); }).join(" ");
    var kmm = rt.km_markers.map(function (m) {
      var p = g.p(m.lat, m.lng);
      return '<circle class="r-km" cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="3.5"/><text class="r-km-t" x="' + (p[0] + 6).toFixed(1) + '" y="' + (p[1] - 5).toFixed(1) + '">' + m.km + "</text>";
    }).join("");
    var color = rt.id === "main" ? "accent" : "route2";
    var stops = rt.stops.slice(0, -1).map(function (x) {
      var p = g.p(x.lat, x.lng), r = x.n === 0 ? 12 : 10;
      return '<circle class="r-stop" cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="' + r + '" style="fill:var(--' + color + ')"><title>' + esc(x.name_ko) + "</title></circle>" +
        '<text class="r-stop-t" x="' + p[0].toFixed(1) + '" y="' + (p[1] + 4).toFixed(1) + '" text-anchor="middle">' + (x.n === 0 ? "S" : x.n) + "</text>";
    }).join("");
    box.innerHTML = svgWrap(g, baseMap(g) + '<polyline class="r-line r-' + (rt.id === "main" ? "main" : "short") + '" points="' + pts + '"/>' + kmm + stops, "러닝 코스 약도");
  }
  function anchorAtPlace(id) {
    var all = [].concat(TABS.food.items, TABS.beer.items, TABS.bars.items, TABS.sights.items);
    var it = all.filter(function (x) { return x.id === id; })[0];
    if (it && it.lat != null) {
      state.anchor = "place"; state.origin = { lat: it.lat, lng: it.lng }; state.originLabel = it.name_ko || it.name;
      state.sort[state.tab] = "distance"; render(); window.scrollTo({ top: 0, behavior: "smooth" });
    }
  }

  function appliedCount(f) {
    var n = 0;
    for (var k in f.sel) n += keys(f.sel[k]).length;
    return n + (f.minRating ? 1 : 0) + (f.maxBeer ? 1 : 0) + (f.free ? 1 : 0) + (f.must ? 1 : 0) + (f.open ? 1 : 0) + (f.q ? 1 : 0) + (state.maxKm ? 1 : 0);
  }

  function renderResults() {
    var tab = state.tab, f = state.f[tab], items = TABS[tab].items;
    var list = items.filter(function (it) { return matches(it, f); });
    var sortKey = state.sort[tab];
    list.sort(SORTS[sortKey] || SORTS.rating);
    var card = tab === "sights" ? sightCard : fnbCard;
    var grid = document.getElementById("grid"), mv = document.getElementById("mapview");
    var asMap = (state.view[tab] || "list") === "map" && list.length > 0;
    state._list = list;
    renderChips();
    mv.hidden = !asMap; grid.hidden = asMap;
    if (asMap) { grid.innerHTML = ""; renderMapView(list); }
    else grid.innerHTML = list.length ? list.map(card).join("") :
      '<div class="empty">조건에 맞는 곳이 없어요. 필터를 줄이거나 <button type="button" class="reset" id="reset2">초기화</button> 해 보세요.</div>';
    document.getElementById("rtitle").textContent = TABS[tab].title;
    var sub = list.length + "곳 · " + SORT_LABELS[sortKey];
    if (state.maxKm) sub += " · " + anchorLabel() + " " + state.maxKm + "km 이내";
    document.getElementById("rsub").textContent = sub;
    var n = appliedCount(f);
    document.getElementById("applied").textContent = n ? n + "개 적용" : "";
    var notice = document.getElementById("notice");
    var missing = state.maxKm ? items.length - coordCount(items) : 0;
    if (state.anchor === "me" && !state.origin) { notice.hidden = false; notice.textContent = "위치를 확인하는 중이에요…"; }
    else if (missing > 0) { notice.hidden = false; notice.textContent = "좌표가 없는 " + missing + "곳은 거리 필터에서 빠졌어요."; }
    else notice.hidden = true;
  }

  function render() {
    var tab = state.tab;
    document.querySelectorAll(".tabs a").forEach(function (a) {
      if (a.getAttribute("data-tab") === tab) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
      var t = TABS[a.getAttribute("data-tab")], n = a.querySelector(".n");
      if (n && t) n.textContent = t.items.length;
    });
    var isWine = tab === "wine", isRun = tab === "run";
    document.getElementById("layout").hidden = isWine || isRun;
    document.getElementById("wineview").hidden = !isWine;
    document.getElementById("runview").hidden = !isRun;
    document.getElementById("fab").hidden = isWine || isRun;
    if (isWine) { renderWine(); return; }
    if (isRun) { renderRun(); return; }
    renderFilters();
    renderToolbar();
    renderResults();
  }

  function setTab(t) { if (!TABS[t]) t = "food"; state.tab = t; store("tab", t); render(); }

  // ------------------------------------------------------------ events
  document.getElementById("filters").addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b || b.disabled) return;
    var f = state.f[state.tab];
    state.preset[state.tab] = null;
    if (b.id === "reset") { state.f[state.tab] = fresh(); state.maxKm = 0; render(); return; }
    if (b.hasAttribute("data-facet")) {
      var fac = b.getAttribute("data-facet"), v = b.getAttribute("data-v");
      f.sel[fac] = f.sel[fac] || {}; f.sel[fac][v] = !f.sel[fac][v];
    }
    else if (b.hasAttribute("data-anchor")) {
      state.anchor = b.getAttribute("data-anchor");
      if (state.anchor === "me") locate(); else store("anchor", state.anchor);
      if (!state.maxKm && state.sort[state.tab] !== "distance") state.sort[state.tab] = "distance";
    }
    else if (b.hasAttribute("data-km")) { state.maxKm = Number(b.getAttribute("data-km")); }
    else if (b.hasAttribute("data-rating")) { f.minRating = Number(b.getAttribute("data-rating")); }
    else if (b.hasAttribute("data-beer")) { f.maxBeer = Number(b.getAttribute("data-beer")); if (f.maxBeer && state.sort[state.tab] === "rating") state.sort[state.tab] = "beer"; }
    else if (b.hasAttribute("data-toggle")) { var k = b.getAttribute("data-toggle"); f[k] = !f[k]; }
    render();
  });
  document.getElementById("filters").addEventListener("input", function (e) {
    if (e.target.id === "q") { state.f[state.tab].q = e.target.value.trim(); renderResults(); }
  });
  document.getElementById("filters").addEventListener("change", function (e) {
    if (e.target.id === "sort") { state.sort[state.tab] = e.target.value; renderResults(); }
  });
  function cardClicks(e) {
    if (e.target.id === "reset2") { state.f[state.tab] = fresh(); state.maxKm = 0; state.preset[state.tab] = null; render(); return; }
    var pb = e.target.closest("[data-place]");
    if (pb) { anchorAtPlace(pb.getAttribute("data-place")); return; }
    var dot = e.target.closest("[data-id]");
    if (dot && e.currentTarget.id === "mapview") { state.mapSel = dot.getAttribute("data-id"); renderMapView(state._list || []); }
  }
  document.getElementById("grid").addEventListener("click", cardClicks);
  document.getElementById("mapview").addEventListener("click", cardClicks);
  document.getElementById("toolbar").addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    if (b.hasAttribute("data-preset")) applyPreset(b.getAttribute("data-preset"));
    else if (b.hasAttribute("data-view")) { state.view[state.tab] = b.getAttribute("data-view"); store("view", state.view[state.tab]); renderToolbar(); renderResults(); }
  });
  document.getElementById("achips").addEventListener("click", function (e) {
    var b = e.target.closest("[data-chip]"); if (b) removeChip(b.getAttribute("data-chip"));
  });
  document.getElementById("runview").addEventListener("click", function (e) {
    var b = e.target.closest("[data-route]"); if (b) { state.route = b.getAttribute("data-route"); renderRun(); }
  });
  document.getElementById("fab").addEventListener("click", function () {
    var rail = document.getElementById("rail"); rail.open = true; rail.scrollIntoView({ behavior: "smooth", block: "start" });
  });
  var resizeT = null;
  window.addEventListener("resize", function () {
    clearTimeout(resizeT);
    resizeT = setTimeout(function () {
      if (state.tab === "run") renderRun();
      else if (!document.getElementById("mapview").hidden) renderMapView(state._list || []);
    }, 200);
  });
  function locate() {
    if (!navigator.geolocation) { state.anchor = "dom"; render(); return; }
    navigator.geolocation.getCurrentPosition(function (p) {
      state.origin = { lat: p.coords.latitude, lng: p.coords.longitude }; render();
    }, function () {
      state.anchor = "dom"; render();
      var n = document.getElementById("notice"); n.hidden = false; n.textContent = "위치 권한이 없어 대성당 기준으로 되돌렸어요.";
    }, { enableHighAccuracy: false, timeout: 8000 });
  }
  document.getElementById("filters").addEventListener("toggle", function (e) {
    if (e.target.classList && e.target.classList.contains("more-filters")) state.moreOpen[state.tab] = e.target.open;
  }, true);
  window.addEventListener("hashchange", function () { setTab(location.hash.slice(1)); });

  var foot = document.getElementById("foot");
  foot.innerHTML = "데이터 기준일 " + esc(G.generated || "") + " · 식음료는 구글 평점 " + ((G.criteria || {}).min_google_rating || 4.2) +
    "+ & 리뷰 " + ((G.criteria || {}).min_google_reviews || 50) + "+만 표시 · 평점·영업시간은 방문 전 구글 지도에서 다시 확인하세요.";
  document.getElementById("stamp").textContent = (G.generated ? G.generated.slice(0, 7).replace("-", ".") + " 조사 · " : "") + "구글 ★4.2+ · 리뷰 50+";

  var rail = document.getElementById("rail");
  if (window.matchMedia && window.matchMedia("(min-width: 960px)").matches) rail.open = true;
  setTab((location.hash || "").slice(1) || recall("tab") || "food");
})();
</script>
</body>
</html>
